<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Customization</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Customize Your Pizza</h1>

<form id="form">
    <!-- TODO: Change this so dynamic content will be inserted here -->
    <fieldset>
        <legend>Please select your pizza size</legend>
        <ul>
            <li>
                <label>
                    <input type="radio" id="medium" name="size" value="medium"/>
                    Medium
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" id="large" name="size" value="large"/>
                    Large
                </label>
            </li>
        </ul>
    </fieldset>
    <fieldset>
        <legend>Please select your pizza base</legend>
        <ul>
            <li>
                <label>
                    <input type="radio" id="thin-stonebaked" name="base" value="thin stonebaked"/>
                    Thin Stonebaked
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" id="woodfired" name="base" value="woodfired"/>
                    Woodfired
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" id="stuffed-crust" name="base" value="stuffed crust"/>
                    Stuffed Crust
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" id="deep-pan" name="base" value="deep pan"/>
                    Deep Pan
                </label>
            </li>
        </ul>
    </fieldset>
    <fieldset>
        <legend>Please select your pizza base</legend>
        <ul>
            <li>
                <label>
                    <input type="radio" id="no-cheese" name="cheese" value="no cheese"/>
                    No Cheese
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" id="grated-cheese" name="cheese" value="grated cheese"/>
                    Grated Cheese
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" id="vegan-cheese" name="cheese" value="vegan cheese"/>
                    Vegan Cheese
                </label>
            </li>
        </ul>
    </fieldset>
    <fieldset>
        <legend>Please select your pizza sauce</legend>
        <ul>
            <li>
                <label>
                    <input type="radio" id="no-sauce" name="sauce" value="no sauce"/>
                    No Sauce
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" id="tomato-sauce" name="sauce" value="tomato sauce"/>
                    Tomato Sauce
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" id="bbq-sauce" name="sauce" value="bbq sauce"/>
                    BBQ Sauce
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" id="bbq" name="sauce" value="garlic spread"/>
                    Garlic Spread
                </label>
            </li>
        </ul>
    </fieldset>
    <fieldset>
        <legend>Select ALL your toppings</legend>
        <ul>
            <li>
                <label>
                    <input type="checkbox" name="toppings" value="smoked ham">
                    Smoked Ham
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox" name="toppings" value="spicy chicken">
                    Spicy Chicken
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox" name="toppings" value="plain chicken">
                    Plain Chicken
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox" name="toppings" value="diced chorizo">
                    Diced Chorizo
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox" name="toppings" value="bacon">
                    Bacon
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox" name="toppings" value="spicy beef">
                    Spicy Beef
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox" name="toppings" value="diced steak">
                    Diced Steak
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox" name="toppings" value="pepperoni">
                    Pepperoni
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox" name="toppings" value="meatballs">
                    Meatballs
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox" name="toppings" value="mushrooms">
                    Mushrooms
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox" name="toppings" value="red onions">
                    Red Onions
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox" name="toppings" value="mixed peppers">
                    Mixed Peppers
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox" name="toppings" value="sweetcorn">
                    Sweetcorn
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox" name="toppings" value="pineapple pieces">
                    Pineapple Pieces
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox" name="toppings" value="jalepeno peppers">
                    Jalepeno Peppers
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox" name="toppings" value="bbq jackfruit">
                    BBQ Jackfruit
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox" name="toppings" value="sliced black olives">
                    Sliced Black Olives
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox" name="toppings" value="chilli cheese">
                    Chilli Cheese
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox" name="toppings" value="mozzarella slices">
                    Mozzarella Slices
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox" name="toppings" value="grated cheese">
                    Grated Cheese
                </label>
            </li>
        </ul>
    </fieldset>

    <p class="button">
        <button type="submit">Calculate Calories!</button>
    </p>
</form>
<div id="result">

</div>

<script type="module" src="script.js"></script>
</body>
</html>
